# Alerting rules.
#
# **The SLO is on the end-to-end user->bot latency**, not on the
# per-service TTFB. TTFB says which stage is slow; the end-to-end number
# says whether the user is having a good time. A bot whose STT is fast
# but whose LLM is slow has a fast TTFB and a bad experience, and only
# the end-to-end series catches that.
#
# The 2.0 s budget is the initial guess, not a measurement: with
# segmented STT the path is VAD -> full-segment transcription -> LLM -> TTS,
# and the old plan's sub-1 s target assumed streaming partials this
# architecture does not use. M4's measurement sets the real number.

groups:
  - name: voice-ai
    interval: 15s
    rules:
      - record: service:voice_user_bot_latency_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(voice_user_bot_latency_seconds_bucket[5m])))

      - record: service:voice_turn_ttfb_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(voice_turn_ttfb_seconds_bucket[5m])))

      - alert: VoiceTurnLatencyP95BudgetBurn
        expr: service:voice_user_bot_latency_seconds:p95_5m > 2.0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "End-to-end voice turn latency is over budget"
          description: >-
            The p95 of user-stops-speaking to bot-starts-speaking is
            {{ $value | printf "%.2f" }}s, over the 2.0s budget. The bot
            is technically working but the user is waiting.

      - alert: VoiceAgentMetricsAbsent
        expr: absent_over_time(voice_user_bot_latency_seconds_count{job="voice-agent"}[15m])
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The agent is not reporting metrics"
          description: >-
            No user->bot latency samples for 15 minutes. The agent may
            be down, or the metrics endpoint may have been unmounted.
            Note this uses absent_over_time, not increase(...[15m]) == 0:
            the latter is true on a healthy idle system and fires
            spuriously.

      - alert: VoiceMemoryHeadroomLow
        expr: voice_process_resident_memory_bytes{component="python"} > 12000000000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The agent process is close to the machine's memory ceiling"
          description: >-
            The agent's resident memory is {{ $value | humanize1024 }}B,
            over 12 GB of the 16 GB unified memory. This fires before
            swap degrades latency.

      - alert: VoiceAgentDown
        expr: up{job="voice-agent"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The voice agent is down"
          description: "Prometheus has been unable to scrape the agent for 2 minutes."
