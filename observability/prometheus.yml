# Prometheus scrape configuration.
#
# The agent's metrics are served by the same FastAPI app that serves the
# browser client, on the agent's own port — one port, one process, no
# second HTTP server. The endpoint is mounted at /metrics and the ASGI
# app serves /metrics/ with a 307 redirect from /metrics, so the scrape
# path has the trailing slash.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The agent itself: TTFB, TTFA, TTFAT, token counts, and the
  # end-to-end user->bot latency.
  #
  # The timeout is 14 s, not the 10 s default, because this scrape
  # crosses Docker Desktop's host-gateway forwarding on the way to the
  # host and that path intermittently stalls for 5-12 s. The agent
  # itself answers in 15 ms; the stall is in the hop. A default-timeout
  # scrape fails on the stall and leaves a hole in the series, and the
  # "agent is down" alert is about sustained absence, not one slow
  # sample — so the honest fix is to wait, not to fail.
  #
  # It has to stay under the 15 s scrape interval, or Prometheus
  # refuses to load the file.
  - job_name: voice-agent
    metrics_path: "/metrics/"
    scrape_timeout: 14s
    static_configs:
      - targets: ["host.docker.internal:7860"]
      # No target labels here. A target label that shares a name with a
      # scraped label *takes* the name: Prometheus renames the scraped one
      # to `exported_<label>`. A `component: agent` target label therefore
      # turned the memory gauge's `component` label into
      # `exported_component`, and the dashboard legend and the alert both
      # stopped matching. The `job` label already says where a series
      # came from.

  # The collector's Prometheus exporter: the metrics it forwards from
  # the agent's OTLP stream.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]

  # The collector's own self-telemetry, on the pull reader's port.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # Phoenix's own Prometheus endpoint is deliberately NOT scraped.
  # Phoenix starts it on port 9090 with a hardcoded value and no env
  # var to move it (phoenix/server/prometheus.py: start_http_server(9090,
  # addr="::")), so enabling it would take the host's 9090 and collide
  # with the compose Prometheus published on the same port. The signal
  # it would add — Phoenix's own process counters — is the least useful
  # of the three; the agent's latency metrics and the collector's
  # pipeline counters are both scraped directly.
