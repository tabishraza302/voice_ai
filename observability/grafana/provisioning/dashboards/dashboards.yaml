# The dashboard provider.
#
# The dashboard JSON is bind-mounted into /var/lib/grafana/dashboards
# (see docker-compose.yml) and this provider points Grafana at that
# directory, so `observability/grafana/dashboards/voice-ai.json` is the
# single source of truth for the dashboard.
#
# updateIntervalSeconds re-reads the file, so an edit to the dashboard
# shows up without a restart.
apiVersion: 1

providers:
  - name: voice-ai
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
