# The Prometheus datasource, provisioned from file.
#
# The uid is fixed at "prometheus" and the dashboard references it
# directly, rather than through Grafana's import-time
# `${DS_PROMETHEUS}` variable. A datasource variable resolves against
# whatever datasources happen to exist at load time, which is exactly
# the kind of thing that breaks silently at 3 a.m. when the stack is
# brought up by a script rather than a human.
#
# The URL is the compose service name, not localhost: the Grafana
# container reaches Prometheus over the voice-ai-net network.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
