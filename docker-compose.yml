name: voice-agent-builder

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-voice}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  phoenix:
    image: arizephoenix/phoenix:version-20.23.0
    restart: unless-stopped
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    # Phoenix stays on the host loopback. Do not publish it publicly; owners
    # use the authenticated /sessions/{id}/trace route instead.
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-audio:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    # Internal only: no published host ports; dedicated LRU cache for TTS audio clips

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voice}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-voice}
      # pytest always overrides DATABASE_URL with this disposable database.
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voice}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/voice_test
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      # Use defaults only when unset; an explicit empty value disables tracing
      # without changing the compose file.
      PHOENIX_OTLP_ENDPOINT: ${PHOENIX_OTLP_ENDPOINT-http://phoenix:6006/v1/traces}
      PHOENIX_URL: ${PHOENIX_URL-http://phoenix:6006}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-voice-agent}
      FORWARDED_ALLOW_IPS: ${FRONTEND_PROXY_IP:-172.29.253.10}
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/0
      TTS_CACHE_REDIS_URL: ${TTS_CACHE_REDIS_URL:-redis://redis-audio:6379/0}
      TTS_CACHE_PHRASES_JSON:
      # The cache tests write to the audio cache's own Redis, never to the one
      # the application coordinates its calls with.
      TEST_TTS_CACHE_REDIS_URL: redis://redis-audio:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      phoenix:
        condition: service_started
      redis:
        condition: service_healthy
      # The optional TTS audio cache. It is started with the rest of the stack
      # but the backend never waits for it to be ready: the cache is optional
      # and every cache failure is a miss.
      redis-audio:
        condition: service_started
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default
      - backend-proxy

  ingress:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-proxy
      - backend-proxy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      frontend-proxy:
      backend-proxy:
        ipv4_address: ${FRONTEND_PROXY_IP:-172.29.253.10}

volumes:
  postgres-data:
  phoenix-data:

networks:
  frontend-proxy:
  backend-proxy:
    ipam:
      config:
        - subnet: ${BACKEND_PROXY_SUBNET:-172.29.253.0/24}
