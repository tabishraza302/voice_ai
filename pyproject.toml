[project]
name = "voice-ai"
version = "0.1.0"
description = "Fully local, air-gapped English + Hindi voice agent (STT + LLM + TTS + pipeline + Phoenix tracing)."
readme = "README.md"
requires-python = ">=3.12"

# Voice-only bare-minimum refactor: everything pinned exactly so STT/TTS/LLM
# results are reproducible against these versions.
dependencies = [
    # Orchestration. `runner` brings the dev runner AND pipecat-ai-prebuilt
    # (the browser client at /client). `kokoro` = default TTS.
    # `webrtc` = SmallWebRTCTransport. `tracing` = OpenTelemetry.
    # `whisper` makes pipecat.services.whisper.stt importable (it does
    # `from faster_whisper import WhisperModel` at module level, even
    # though WhisperSTTServiceMLX uses mlx-whisper). faster-whisper is
    # never invoked on this path.
    "pipecat-ai[kokoro,runner,webrtc,tracing,whisper]==1.13.0",
    "pipecat-ai-prebuilt==1.3.0",
    # STT runtime: NVIDIA Nemotron 3.5 ASR Streaming 0.6B via MLX,
    # served over its OpenAI-compatible HTTP API.
    "mlx-audio[server,stt]==0.5.9",
    "mlx-whisper==0.4.3",
    # Observability: OpenTelemetry SDK + OTLP/HTTP straight to the host
    # Phoenix on 6006 (no collector, no gRPC).
    "opentelemetry-sdk==1.39.1",
    "opentelemetry-exporter-otlp-proto-http==1.39.1",
    # Audio I/O. Pinned to pipecat-ai's own ranges (soundfile~=0.13.1,
    # soxr~=1.0.0); newer majors do not resolve against 1.13.0.
    "soundfile==0.13.1",
    "soxr==1.0.0",
    # Settings. fastapi is the Pipecat runner app (bot/control.py) and the
    # mlx-audio server runtime; uvicorn is provided transitively by the
    # runner extra.
    "pydantic-settings==2.12.0",
    "pydantic==2.14.1",
    "fastapi==0.141.1",
    # Text processing for the MLX Kokoro TTS path (English G2P + espeak-ng
    # for Hindi). Required for tts_provider=mlx-audio.
    "misaki[en]==0.9.4",
    "httpx==0.28.1",
]

[tool.uv]
package = false
