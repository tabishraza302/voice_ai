name: Qualify

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Qualification profile (local_offline or deployment)"
        required: true
        default: "deployment"
      config:
        description: "Absolute path to reviewed qualification config JSON"
        required: true
        default: "/etc/voice-ai/qualification.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Release Candidate Qualification
    runs-on: [self-hosted, voice-ai-qualification]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install uv 0.11.25
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node.js 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Prepare verification environment and cached images
        run: ./scripts/voice-ai.sh verify prepare

      - name: Run verify release gate
        run: |
          ./scripts/voice-ai.sh verify release \
            --profile "${{ inputs.profile }}" \
            --config "${{ inputs.config }}"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-release-evidence
          path: data/verification/
          retention-days: 30
